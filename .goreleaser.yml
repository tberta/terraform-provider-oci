# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2

project_name: terraform-provider-oci

before:
  hooks:
    # Version and ReleaseDate are consts, so -ldflags -X cannot set them.
    # See scripts/stamp-version.sh for the full explanation.
    - ./scripts/stamp-version.sh {{ .Version }}
    # NOTE: upstream ran `go mod tidy` here, flagged in its own comment as
    # "just an example and not a requirement". Dropped: it needs network
    # access and can rewrite go.mod/go.sum out of sync with the committed
    # vendor/ tree that these builds resolve against.

builds:
  - env:
      # goreleaser does not work with CGO, it could also complicate
      # usage by users in CI/CD systems like Terraform Cloud where
      # they are unable to install libraries.
      - CGO_ENABLED=0
      - GOTOOLCHAIN=go1.26.5+auto
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
      # vendor/ is committed, so the build resolves no modules over the network.
      - -mod=vendor
    # No -X here: main.go declares neither `version` nor `commit`, so upstream's
    # flags were dead. The version arrives via the before-hook instead.
    ldflags:
      - '-s -w'
    # Trimmed from upstream's 15-target matrix to linux only: these builds are
    # consumed by CI runners. Each target is a ~270 MB binary, so every addition
    # costs real build time and release size.
    #
    # CONSEQUENCE: there is no darwin build, so `terraform init` against a mirror
    # holding only these artifacts fails on a macOS workstation, and a
    # .terraform.lock.hcl generated on one carries no hash CI can use. Either
    # keep the lock file gitignored, or generate it for linux explicitly:
    #   terraform providers lock -platform=linux_amd64 <source-address>
    # Add `darwin` back below if a workstation ever needs to run plans directly.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

# A detached GPG signature over SHA256SUMS. This is NOT for the public Terraform
# Registry -- these builds are never published there. It is required by the
# self-hosted registry protocol endpoint under docs/registry/: Terraform's
# registry install path enforces the signature (measured -- an unsigned download
# response gets as far as checksumming, then fails with "authentication
# signature from unknown issuer"). The network mirror path does not; it verifies
# the `h1:` dirhashes in .terraform.lock.hcl instead. Both paths are published,
# so the signature is what makes the registry one usable.
signs:
  - artifacts: checksum
    args:
      # Non-interactive: there is no tty in Actions.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      # NOTE: upstream also passed --passphrase here, which gpg ignores unless
      # --pinentry-mode loopback is set. The release workflow presets the agent
      # via crazy-max/ghaction-import-gpg instead, so no passphrase is needed.
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  # No `github: owner/name` block: GoReleaser resolves the repository from the
  # git remote. Hardcoding it is what made upstream's config publish to `oracle`.
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # If you want to manually examine the release before its live, uncomment this line:
  # draft: true

changelog:
  # Renamed from `skip` in GoReleaser v2. Disabled: this repo's history between
  # fork tags is upstream's, so a generated changelog would be noise.
  disable: true
