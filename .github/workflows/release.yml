# Build, sign and publish a fork release.
#
# TAG SCHEME: v<upstream-version>-fix.<n>, e.g. v8.23.0-fix.1
#
#   - <upstream-version> is the upstream release these fixes sit on top of.
#   - .<n> increments for each fork build against that same upstream base.
#
# The trigger deliberately does NOT match plain `v*`. This repository is a fork
# and already carries every upstream tag; a `v*` trigger would fire a release
# for each one the moment someone ran `git push origin --tags` after syncing
# with upstream. `-fix.` cannot collide with an upstream tag.
#
# The suffix makes each version a semver PRE-RELEASE, which Terraform excludes
# from the ~>, >=, >, <= and < operators -- consumers must pin exactly. If range
# constraints are ever wanted, switch to a plain-semver line instead
# (e.g. 8.23.1000, 8.23.1001) and update the pattern below to match.
#
# These builds are never published to the public Terraform Registry. They are
# consumed two ways, and this workflow publishes the metadata for both:
#
#   1. network mirror   -> docs/providers/...  (no signature needed)
#   2. self-hosted registry protocol -> docs/registry/v1/...  (signature REQUIRED)
#
# Route 2 is why the release is GPG-signed and why this workflow needs the
# GPG_PRIVATE_KEY and PASSPHRASE repository secrets. See .goreleaser.yml.
name: Release

on:
  push:
    tags:
      - 'v*.*.*-fix.*'

permissions:
  # Needed to create the GitHub Release, upload its assets, and commit the
  # network mirror metadata.
  contents: write

env:
  # Provider source address. With a mirror this is only a naming key -- nothing
  # ever contacts github.com to resolve it -- but it dictates the mirror path
  # layout (<base>/<hostname>/<namespace>/<type>/), so changing it moves the
  # published files and requires consumers to run
  # `terraform state replace-provider`.
  SOURCE_ADDR: github.com/tberta/oci
  # Registry protocol address is tberta.github.io/<namespace>/<type>. The
  # hostname is NOT part of the published path -- it is implied by the
  # .well-known/terraform.json discovery document in the tberta/tberta.github.io
  # repo, which must sit at the host root.
  REGISTRY_NAMESPACE: tberta
  REGISTRY_TYPE: oci
  # Public half of the key goreleaser signs SHA256SUMS with. Published inline in
  # every download response; the script refuses to publish if the release
  # signature does not verify against it.
  SIGNING_KEY: scripts/registry-signing-key.asc
  # Branch the metadata is committed to, and which GitHub Pages serves from
  # (Settings -> Pages -> Deploy from a branch -> this branch, /docs).
  MIRROR_BRANCH: adb-day2-fixes

# Two releases publishing at once would race on index.json and versions, both
# of which are read-modify-write.
concurrency:
  group: release-mirror
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Two linux targets at ~6m30s each (measured). The cap stops a hung build
    # from burning the budget; raise it if the matrix widens.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history and tags to resolve the version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod requires >= 1.25.0. Read it from there rather than
          # .go-version, which is stale (1.24.10) and would fail the build.
          go-version-file: 'go.mod'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by the `signs` section of .goreleaser.yml. This action also
          # preloads the passphrase into the agent, so gpg does not prompt.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # vendor/ is committed; never resolve modules over the network.
          GOFLAGS: -mod=vendor
          # Do not let the go command download a different toolchain.
          GOTOOLCHAIN: local

  mirror:
    name: Publish mirror and registry metadata
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the mirror branch
        uses: actions/checkout@v4
        with:
          # Not the tag: this job commits, so it needs a branch to commit onto.
          ref: ${{ env.MIRROR_BRANCH }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate network mirror metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-network-mirror.sh \
            "${GITHUB_REF_NAME#v}" \
            "${GITHUB_REF_NAME}" \
            "${SOURCE_ADDR}" \
            "${GITHUB_REPOSITORY}" \
            docs

      # Separate script, separate protocol: this one needs the release signature
      # and publishes the plain sha256, not the mirror's `h1:` dirhashes.
      - name: Generate registry protocol metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-registry.sh \
            "${GITHUB_REF_NAME#v}" \
            "${GITHUB_REF_NAME}" \
            "${REGISTRY_NAMESPACE}" \
            "${REGISTRY_TYPE}" \
            "${GITHUB_REPOSITORY}" \
            docs \
            "${SIGNING_KEY}"

      - name: Commit and push
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "metadata already up to date, nothing to commit"
            exit 0
          fi
          git commit -m "Publish mirror and registry metadata for ${GITHUB_REF_NAME}"
          # Rebase rather than force: the branch may have moved since checkout.
          git pull --rebase origin "${MIRROR_BRANCH}"
          git push origin "HEAD:${MIRROR_BRANCH}"
